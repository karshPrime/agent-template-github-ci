name: ci

# pull_request rather than pull_request_target, so a fork's code never runs with this repository's secrets
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # pull requests share a group per branch so newer pushes replace older runs; each commit on main
  # gets its own group, since a pending run in a shared group is dropped and its tag would be skipped
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  # renovate: datasource=pypi depName=shellcheck-py
  SHELLCHECK_PY_VERSION: 0.11.0.1

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history, so every existing release tag is available to compare against
          fetch-depth: 0
      - name: VERSION holds a single vX.Y.Z version
        run: |
          if ! grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' VERSION || [ "$(grep -c "" VERSION)" -ne 1 ]; then
            echo "::error file=VERSION::VERSION must be one line of the form vX.Y.Z"
            exit 1
          fi
      - name: VERSION is higher than every release tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          latest=$(git tag --list --sort=-v:refname | { grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' || true; } | sed -n 1p)
          if [ -n "$latest" ]; then
            highest=$(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1)
            if [ "$version" = "$latest" ] || [ "$highest" != "$version" ]; then
              echo "::error file=VERSION::VERSION is $version but $latest is already released; bump it above $latest"
              exit 1
            fi
          fi

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          version=${ACTIONLINT_VERSION#v}
          archive="actionlint_${version}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/actionlint_${version}_checksums.txt"
          grep " $archive\$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" actionlint
      # the runner's preinstalled shellcheck is older and flags different things, so lint runs a pinned one
      - name: Install shellcheck
        run: |
          python3 -m venv "$RUNNER_TEMP/shellcheck"
          "$RUNNER_TEMP/shellcheck/bin/pip" install --quiet "shellcheck-py==$SHELLCHECK_PY_VERSION"
      - name: Lint the shipped and repository workflows
        run: '"$RUNNER_TEMP/actionlint" -shellcheck="$RUNNER_TEMP/shellcheck/bin/shellcheck" template/.github/workflows/*.yml .github/workflows/*.yml'

  tag:
    if: github.event_name == 'push'
    needs: [version, lint]
    runs-on: ubuntu-24.04
    permissions:
      # creates the tag named in VERSION on the merged commit
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "tag=$(tr -d "[:space:]" < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${process.env.TAG}`, sha: context.sha });
            core.notice(`Tagged ${context.sha} as ${process.env.TAG}`);
